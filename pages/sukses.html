<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14213d">
  <title>Laporan Terkirim — ASPIRA</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><a class="brand brand-link" href="../index.html"><div class="brand-mark brand-mark-image"><img src="../assets/aspira-brand-mark.png" alt="ASPIRA"></div><div><div class="brand-name">ASPIRA</div><div class="brand-subtitle">Sistem Pengaduan Serikat</div></div></a></header>
    <section class="page active">
      <div class="success-card">
        <div class="success-mark">✓</div>
        <span class="eyebrow">LAPORAN TERKIRIM</span>
        <h2>Laporan berhasil dikirim</h2>
        <p>Simpan kode berikut. Kode ini digunakan untuk melihat perkembangan laporan Anda.</p>
        <div class="ticket-code" id="generatedCode">ASP-XXXXXX</div>
        <button class="copy-btn" id="copyBtn">Salin Kode</button>
        <div class="warning"><strong>⚠ Simpan kode ini</strong><span>Kode tidak boleh dibagikan kepada orang lain.</span></div>
        <div class="success-actions">
          <a class="submit-btn button-link" href="track.html" id="trackLink">Track Laporan →</a>
          <a class="secondary-btn button-link" href="../index.html">Kembali ke Beranda</a>
        </div>
      </div>
    </section>
  </main>
  <script src="../js/sukses.js"></script>
</body>
</html>
